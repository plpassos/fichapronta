<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Primeiro acesso</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0B6875}a:hover{color:#084F59}
</style>
<style>body{background:#F3F6F6}.voltar{display:block;padding:10px 16px;font:14px Inter,sans-serif}</style>
</head>
<body>
<a class="voltar" href="index.html">← Todas as telas</a>
<div style="display:flex;justify-content:center">

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F6F6; font-family: Inter, sans-serif; color: #10292B; display: flex; flex-direction: column; padding: 32px 20px 24px; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; font-size: 13px; color: #4F6668"><b style="color: #10292B">Passo 1 de 2 · Seus dados</b><span>Depois: suas técnicas</span></div>
<div style="height: 6px; background: #D3E1E0; border-radius: 99px"><div style="width: 50%; height: 6px; background: #0B6875; border-radius: 99px"></div></div>
</div>
<h1 style="margin: 0; font-size: 24px; line-height: 1.2">Bem-vindo! Vamos montar seu perfil</h1>
<div style="background: #FFFFFF; border: 1px solid #D3E1E0; border-radius: 16px; padding: 20px 18px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="nome" style="font-size: 14px; font-weight: 500">Nome que o paciente vai ver</label>
<input id="nome" value="Lucas A. Passos" style="min-height: 46px; box-sizing: border-box; width: 100%; padding: 0 12px; border-radius: 10px; border: 1px solid #C3D3D2; background: #F3F6F6; font: inherit; font-size: 16px; color: #10292B">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="prof" style="font-size: 14px; font-weight: 500">Profissão</label>
<select id="prof" style="min-height: 46px; box-sizing: border-box; width: 100%; padding: 0 12px; border-radius: 10px; border: 1px solid #C3D3D2; background: #F3F6F6; font: inherit; font-size: 16px; color: #10292B"><option>Fisioterapeuta</option><option>Massoterapeuta</option><option>Quiropraxista</option><option>Outra</option></select>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="reg" style="font-size: 14px; font-weight: 500">Registro profissional (opcional)</label>
<input id="reg" placeholder="Ex.: CREFITO-3 000000-F" style="min-height: 46px; box-sizing: border-box; width: 100%; padding: 0 12px; border-radius: 10px; border: 1px solid #C3D3D2; background: #F3F6F6; font: inherit; font-size: 16px; color: #10292B">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="wa" style="font-size: 14px; font-weight: 500">WhatsApp para avisos de ficha nova</label>
<input id="wa" type="tel" placeholder="(11) 90000-0000" style="min-height: 46px; box-sizing: border-box; width: 100%; padding: 0 12px; border-radius: 10px; border: 1px solid #C3D3D2; background: #F3F6F6; font: inherit; font-size: 16px; color: #10292B">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="link" style="font-size: 14px; font-weight: 500">Endereço do seu link</label>
<div style="display: flex; align-items: center; min-height: 46px; border-radius: 10px; border: 1px solid #C3D3D2; background: #F3F6F6; padding: 0 12px; font-size: 16px"><span style="color: #4F6668">fichapronta.app/</span><input id="link" value="lucas" style="flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 16px; color: #10292B; padding: 0"></div>
<div style="font-size: 13px; color: #0B5560">✓ Disponível</div>
</div>
</div>
<div style="font-size: 13px; color: #4F6668">Ao continuar, você aceita os <a href="#">termos de uso</a> e a <a href="#">política de privacidade</a>.</div>
<button type="button" style="margin-top: auto; min-height: 52px; border-radius: 12px; border: 0; background: #0B6875; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 600">Continuar: escolher técnicas</button>
</div>
</div>

</body>
</html>
